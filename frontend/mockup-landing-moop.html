<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --raspberry-wine: #500E2F;
      --eggplant: #820D51;
      --grape: #6528CE;
      --punch: #B21030;
      --mint: #87DCAB;
      --mustard: #D1912A;
      --pinky: #FEAED2;
      --trumskin: #CC6711;
      --shreks-toe: #A3AF0A;
      --white: #FFFDFD;
      --black: #020202;
      --cream: #F3E49D;
      --lavender: #D0BBF6;
      --sky: #71B2E6;
      --coral: #F15241;
      --peach: #FFE1B1;
      --mint-foam: #D4FFE5;
      --frost: #EAFFF3;
      --rose-mist: #FFE5EA;
      --amber: #ED9302;
      --apricot: #FFB271;
      --wisteria: #D99EFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fredoka', sans-serif;
      background: var(--raspberry-wine);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* ── Drifting swatches ── */
    .swatch { position: fixed; z-index: 0; border-radius: 28px; will-change: transform; }
    .swatch-1 { width: 480px; height: 420px; background: var(--grape); top: -80px; left: -100px; border-radius: 44px; animation: drift1 55s ease-in-out infinite; }
    .swatch-2 { width: 520px; height: 380px; background: var(--eggplant); top: -70px; right: -120px; border-radius: 40px; animation: drift2 65s ease-in-out infinite; }
    .swatch-3 { width: 340px; height: 280px; background: var(--trumskin); top: 38%; left: -60px; border-radius: 36px; animation: drift3 50s ease-in-out infinite; }
    .swatch-4 { width: 400px; height: 340px; background: var(--mint); bottom: -90px; right: -60px; border-radius: 44px; animation: drift4 60s ease-in-out infinite; }
    .swatch-5 { width: 360px; height: 300px; background: var(--punch); bottom: -70px; left: -80px; border-radius: 38px; animation: drift5 45s ease-in-out infinite; }
    .swatch-6 { width: 260px; height: 220px; background: var(--mustard); top: 5%; left: 40%; border-radius: 32px; animation: drift6 52s ease-in-out infinite; }
    .swatch-7 { width: 280px; height: 240px; background: var(--pinky); top: 48%; right: 2%; border-radius: 34px; animation: drift7 58s ease-in-out infinite; }
    .swatch-8 { width: 220px; height: 200px; background: var(--shreks-toe); bottom: 8%; left: 32%; border-radius: 30px; animation: drift8 48s ease-in-out infinite; }
    .swatch-9 { width: 200px; height: 180px; background: var(--lavender); top: 22%; right: 18%; border-radius: 28px; animation: drift9 62s ease-in-out infinite; }

    @keyframes drift1 { 0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(180px,120px) rotate(6deg)} 50%{transform:translate(60px,220px) rotate(-3deg)} 75%{transform:translate(-120px,80px) rotate(4deg)} }
    @keyframes drift2 { 0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(-150px,160px) rotate(-5deg)} 50%{transform:translate(-240px,60px) rotate(3deg)} 75%{transform:translate(-60px,-120px) rotate(-3deg)} }
    @keyframes drift3 { 0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(160px,-140px) rotate(7deg)} 50%{transform:translate(240px,-50px) rotate(3deg)} 75%{transform:translate(80px,120px) rotate(-4deg)} }
    @keyframes drift4 { 0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(-130px,-180px) rotate(-4deg)} 50%{transform:translate(-200px,-80px) rotate(4deg)} 75%{transform:translate(-60px,70px) rotate(-3deg)} }
    @keyframes drift5 { 0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(170px,-100px) rotate(5deg)} 50%{transform:translate(90px,-200px) rotate(-3deg)} 75%{transform:translate(-70px,-120px) rotate(4deg)} }
    @keyframes drift6 { 0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(-100px,150px) rotate(-6deg)} 50%{transform:translate(80px,200px) rotate(4deg)} 75%{transform:translate(140px,60px) rotate(-3deg)} }
    @keyframes drift7 { 0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(-140px,-130px) rotate(5deg)} 50%{transform:translate(-60px,110px) rotate(-4deg)} 75%{transform:translate(110px,-70px) rotate(3deg)} }
    @keyframes drift8 { 0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(100px,-150px) rotate(-5deg)} 50%{transform:translate(-80px,-190px) rotate(6deg)} 75%{transform:translate(-140px,60px) rotate(-3deg)} }
    @keyframes drift9 { 0%,100%{transform:translate(0,0) rotate(0)} 25%{transform:translate(140px,100px) rotate(5deg)} 50%{transform:translate(-100px,170px) rotate(-4deg)} 75%{transform:translate(-160px,-60px) rotate(3deg)} }

    /* ── Landing ── */
    .landing {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 32px 20px;
      width: 100%;
      max-width: 380px;
    }

    .logo-area { text-align: center; }

    .logo {
      font-family: 'Fredoka', sans-serif;
      font-size: 5.5rem;
      font-weight: 700;
      color: var(--punch);
      line-height: 1;
      letter-spacing: 4px;
      cursor: default;
      user-select: none;
    }

    /* ── Card + Moop layout ── */
    .card-row {
      position: relative;
      width: 100%;
      max-width: 380px;
    }

    .card {
      width: 100%;
      background: rgba(42, 18, 32, 0.85);
      border: 3px solid var(--eggplant);
      border-radius: 20px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* ── Moop sidebar — positioned off to the right on desktop ── */
    .moop-sidebar {
      position: absolute;
      left: calc(100% + 30px);
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .moop-preview {
      position: relative;
      width: 200px;
      height: 200px;
      animation: wobble 3s ease-in-out infinite;
    }

    .moop-preview .layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      image-rendering: auto;
      pointer-events: none;
    }

    .moop-preview .layer-color { z-index: 1; }
    .moop-preview .layer-base  { z-index: 2; }
    .moop-preview .layer-eyes  { z-index: 3; }
    .moop-preview .layer-mouth { z-index: 4; }
    .moop-preview .layer-acc   { z-index: 5; }
    .moop-preview .layer-hat   { z-index: 6; }

    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(3deg); }
      75% { transform: rotate(-3deg); }
    }

    .btn-customize {
      border: none;
      border-radius: 10px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 14px;
      background: rgba(42, 18, 32, 0.8);
      border: 2px solid rgba(130, 13, 81, 0.5);
      color: var(--peach);
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s, color 0.15s;
      backdrop-filter: blur(8px);
    }

    .btn-customize:hover {
      border-color: var(--lavender);
      color: var(--lavender);
      transform: translateY(-2px);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }

    .field label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--peach);
    }

    .field input {
      background: rgba(20, 8, 14, 0.8);
      border: 2px solid #5A2848;
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--white);
      font-family: 'Fredoka', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input::placeholder { color: #5A3548; }
    .field input:focus { border-color: var(--mint); }

    /* ── Buttons ── */
    .btn {
      border: none;
      border-radius: 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(2px); }

    .btn-create {
      width: 100%;
      padding: 14px 24px;
      background: var(--mint);
      color: #1A3A28;
    }

    .divider {
      text-align: center;
      color: #6A4858;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 2px;
      background: #3A1828;
      border-radius: 1px;
    }

    .join-row { display: flex; gap: 8px; }

    .join-row input {
      flex: 1;
      background: rgba(20, 8, 14, 0.8);
      border: 2px solid #5A2848;
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--white);
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.15s;
    }
    .join-row input::placeholder { color: #5A3548; letter-spacing: 2px; }
    .join-row input:focus { border-color: var(--lavender); }

    .btn-join {
      padding: 12px 22px;
      background: var(--lavender);
      color: #2A1540;
    }

    .footer {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .footer button {
      background: none;
      border: none;
      color: #7A5068;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s;
      padding: 4px 0;
      border-bottom: 2px dotted #3A1828;
    }
    .footer button:hover { color: var(--pinky); border-bottom-color: var(--pinky); }

    .footer .sep {
      color: #3A1828;
      font-size: 0.7rem;
      align-self: center;
    }

    /* ── Modal overlay ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(10, 2, 6, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: safe center;
      justify-content: center;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* ── Moop customizer (inside modal) ── */
    .modal-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--peach);
      letter-spacing: 1px;
    }

    .moop-stage {
      position: relative;
      width: 180px;
      height: 180px;
      animation: wobble 3s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(3deg); }
      75% { transform: rotate(-3deg); }
    }

    .moop-stage .layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      image-rendering: auto;
      pointer-events: none;
    }

    .moop-stage .layer-color { z-index: 1; }
    .moop-stage .layer-base  { z-index: 2; }
    .moop-stage .layer-eyes  { z-index: 3; }
    .moop-stage .layer-mouth { z-index: 4; }
    .moop-stage .layer-acc   { z-index: 5; }
    .moop-stage .layer-hat   { z-index: 6; }

    .slot-panel {
      width: 100%;
      background: rgba(42, 18, 32, 0.85);
      border: 3px solid var(--eggplant);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      overflow: hidden;
    }

    .slot-tabs {
      display: flex;
      border-bottom: 2px solid rgba(130, 13, 81, 0.4);
    }

    .slot-tab {
      flex: 1;
      padding: 12px 4px;
      background: none;
      border: none;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      color: #7A5068;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      text-align: center;
      position: relative;
    }

    .slot-tab:hover { color: var(--peach); background: rgba(130, 13, 81, 0.15); }

    .slot-tab.active {
      color: var(--mint);
      background: rgba(135, 220, 171, 0.08);
    }

    .slot-tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 20%; right: 20%;
      height: 3px;
      background: var(--mint);
      border-radius: 3px 3px 0 0;
    }

    .slot-items {
      padding: 16px;
      display: none;
      gap: 10px;
    }

    .slot-items.active {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .slot-item {
      aspect-ratio: 1;
      background: rgba(153, 135, 144, 0.7);
      border: 2px solid #5A2848;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, transform 0.1s, background 0.15s;
      position: relative;
      overflow: hidden;
    }

    .slot-item:hover { border-color: var(--lavender); transform: translateY(-2px); }

    .slot-item.selected {
      border-color: var(--mint);
      background: rgba(135, 220, 171, 0.1);
      box-shadow: 0 0 12px rgba(135, 220, 171, 0.2);
    }

    .slot-item img {
      width: 80%; height: 80%;
      object-fit: contain;
      image-rendering: auto;
    }

    .slot-item.none-item {
      font-size: 1.4rem;
      color: #5A3548;
      font-weight: 700;
    }
    .slot-item.none-item:hover { color: var(--coral); }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: #5A3548;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 20px 0;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .modal-buttons .btn {
      flex: 1;
      padding: 12px 20px;
      font-size: 1rem;
    }

    .btn-randomize { background: var(--lavender); color: #2A1540; }
    .btn-done { background: var(--mint); color: #1A3A28; }

    /* ── Corner ── */
    .corner {
      position: fixed;
      z-index: 5;
      font-size: 0.65rem;
      font-weight: 500;
      pointer-events: none;
      opacity: 0.4;
    }
    .corner.tr { top: 14px; right: 16px; color: var(--mustard); }

    @media (max-width: 560px) {
      .logo { font-size: 3.8rem; }
      .card { padding: 22px 18px; }
      .moop-sidebar {
        position: static;
        transform: none;
        flex-direction: row;
        justify-content: center;
        gap: 14px;
        margin-top: 18px;
        width: 100%;
      }
      .moop-preview { width: 80px; height: 80px; }
      .moop-stage { width: 150px; height: 150px; }
      .slot-items.active { grid-template-columns: repeat(3, 1fr); }
      .slot-tab { font-size: 0.65rem; padding: 10px 2px; }
    }
  </style>
</head>
<body>

  <!-- Drifting swatches -->
  <div class="swatch swatch-1"></div>
  <div class="swatch swatch-2"></div>
  <div class="swatch swatch-3"></div>
  <div class="swatch swatch-4"></div>
  <div class="swatch swatch-5"></div>
  <div class="swatch swatch-6"></div>
  <div class="swatch swatch-7"></div>
  <div class="swatch swatch-8"></div>
  <div class="swatch swatch-9"></div>

  <div class="corner tr">v0.4</div>

  <main class="landing">
    <div class="logo-area">
      <div class="logo">MORP</div>
    </div>

    <div class="card-row">
      <div class="card">
        <div class="field">
          <label for="name-input">your name</label>
          <input type="text" id="name-input" placeholder="type here..." maxlength="20" autofocus>
        </div>

        <button class="btn btn-create" id="create-btn">Create Lobby</button>

        <div class="divider">or</div>

        <div class="join-row">
          <input type="text" id="code-input" placeholder="lobby code" maxlength="6">
          <button class="btn btn-join" id="join-btn">Join</button>
        </div>
      </div>

      <div class="moop-sidebar">
        <div class="moop-preview" id="moop-preview"></div>
        <button class="btn-customize" id="moop-btn">customize</button>
      </div>
    </div>

    <div class="footer">
      <button id="changelog-btn">changelog</button>
      <span class="sep">·</span>
      <button id="help-btn">how to play</button>
    </div>
  </main>

  <!-- Moop customizer modal -->
  <div class="modal-overlay" id="moop-modal">
    <div class="modal-content">
      <div class="modal-title">customize your moop</div>

      <div class="moop-stage" id="moop-stage"></div>

      <div class="slot-panel">
        <div class="slot-tabs">
          <button class="slot-tab active" data-tab="colors">colors</button>
          <button class="slot-tab" data-tab="hats">hats</button>
          <button class="slot-tab" data-tab="eyes">eyes</button>
          <button class="slot-tab" data-tab="mouths">mouths</button>
          <button class="slot-tab" data-tab="accessories">acc</button>
        </div>
        <div class="slot-items active" id="grid-colors"></div>
        <div class="slot-items" id="grid-hats"></div>
        <div class="slot-items" id="grid-eyes"></div>
        <div class="slot-items" id="grid-mouths"></div>
        <div class="slot-items" id="grid-accessories"></div>
      </div>

      <div class="modal-buttons">
        <button class="btn btn-randomize" id="randomize-btn">randomize</button>
        <button class="btn btn-done" id="done-btn">done</button>
      </div>
    </div>
  </div>

  <script>
    const COSMETICS = {
      colors: [
        { id: 'trumskin', name: 'Trumskin', file: 'cosmetics/colors/trumskin.png', default: true },
        { id: 'punch', name: 'Punch', file: 'cosmetics/colors/punch.png' },
      ],
      hats: [
        { id: 'none', name: 'None', type: 'none' },
        { id: 'cap', name: 'Cap', file: 'cosmetics/hats/cap.png' },
        { id: 'flower', name: 'Flower', file: 'cosmetics/hats/flower.png' },
        { id: 'babushka', name: 'Babushka', file: 'cosmetics/hats/babushka.png' },
        { id: 'beanie', name: 'Beanie', file: 'cosmetics/hats/beanie_pompom.png' },
        { id: 'bow', name: 'Bow', file: 'cosmetics/hats/bow.png' },
        { id: 'crooner', name: 'Crooner', file: 'cosmetics/hats/crooner.png' },
        { id: 'crown', name: 'Crown', file: 'cosmetics/hats/crown.png' },
        { id: 'dunce', name: 'Dunce', file: 'cosmetics/hats/dunce.png' },
        { id: 'halo', name: 'Halo', file: 'cosmetics/hats/halo.png' },
        { id: 'hat_flaps', name: 'Hat Flaps', file: 'cosmetics/hats/hat_flaps.png' },
        { id: 'monk', name: 'Monk', file: 'cosmetics/hats/monk.png' },
        { id: 'ponytail', name: 'Ponytail', file: 'cosmetics/hats/ponytail.png' },
        { id: 'princess', name: 'Princess', file: 'cosmetics/hats/princess.png' },
        { id: 'propeller', name: 'Propeller', file: 'cosmetics/hats/propeller.png' },
        { id: 'slick_back', name: 'Slick Back', file: 'cosmetics/hats/slick_back.png' },
        { id: 'twirl', name: 'Twirl', file: 'cosmetics/hats/twirl.png' },
        { id: 'umbrella', name: 'Umbrella', file: 'cosmetics/hats/umbrella.png' },
      ],
      eyes: [
        { id: 'none', name: 'Default', type: 'none' },
      ],
      mouths: [
        { id: 'none', name: 'Default', type: 'none' },
      ],
      accessories: [
        { id: 'none', name: 'None', type: 'none' },
        { id: 'scarf', name: 'Scarf', file: 'cosmetics/accessories/scarf.png' },
        { id: 'blanket', name: 'Blanket', file: 'cosmetics/accessories/blanket.png' },
        { id: 'tyson', name: 'Tyson', file: 'cosmetics/accessories/tyson.png' },
      ],
    };

    const equipped = {
      colors: 'trumskin',
      hats: 'none',
      eyes: 'none',
      mouths: 'none',
      accessories: 'none',
    };

    // ── Build layered moop into a container ──
    function renderMoopInto(container) {
      container.innerHTML = '';

      const colorItem = COSMETICS.colors.find(c => c.id === equipped.colors);
      if (colorItem && colorItem.file) {
        const img = document.createElement('img');
        img.src = colorItem.file;
        img.className = 'layer layer-color';
        img.alt = '';
        container.appendChild(img);
      }

      const base = document.createElement('img');
      base.src = 'cosmetics/moop.png';
      base.className = 'layer layer-base';
      base.alt = 'moop';
      container.appendChild(base);

      const eyeItem = COSMETICS.eyes.find(e => e.id === equipped.eyes);
      if (eyeItem && eyeItem.file) {
        const img = document.createElement('img');
        img.src = eyeItem.file;
        img.className = 'layer layer-eyes';
        img.alt = '';
        container.appendChild(img);
      }

      const mouthItem = COSMETICS.mouths.find(m => m.id === equipped.mouths);
      if (mouthItem && mouthItem.file) {
        const img = document.createElement('img');
        img.src = mouthItem.file;
        img.className = 'layer layer-mouth';
        img.alt = '';
        container.appendChild(img);
      }

      const accItem = COSMETICS.accessories.find(a => a.id === equipped.accessories);
      if (accItem && accItem.file) {
        const img = document.createElement('img');
        img.src = accItem.file;
        img.className = 'layer layer-acc';
        img.alt = '';
        container.appendChild(img);
      }

      const hatItem = COSMETICS.hats.find(h => h.id === equipped.hats);
      if (hatItem && hatItem.file) {
        const img = document.createElement('img');
        img.src = hatItem.file;
        img.className = 'layer layer-hat';
        img.alt = '';
        container.appendChild(img);
      }
    }

    function renderAll() {
      renderMoopInto(document.getElementById('moop-stage'));
      renderMoopInto(document.getElementById('moop-preview'));
    }

    function renderGrid(category) {
      const grid = document.getElementById(`grid-${category}`);
      grid.innerHTML = '';
      const items = COSMETICS[category];

      if (items.length <= 1 && items[0]?.type === 'none') {
        const none = document.createElement('div');
        none.className = 'slot-item none-item selected';
        none.textContent = 'x';
        none.title = 'None';
        grid.appendChild(none);

        const msg = document.createElement('div');
        msg.className = 'empty-msg';
        msg.textContent = 'more coming soon...';
        grid.appendChild(msg);
        return;
      }

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'slot-item' + (equipped[category] === item.id ? ' selected' : '');
        el.title = item.name;

        if (item.type === 'none') {
          el.classList.add('none-item');
          el.textContent = 'x';
        } else if (item.file) {
          const img = document.createElement('img');
          img.src = item.file;
          img.alt = item.name;
          el.appendChild(img);
        }

        el.onclick = () => {
          equipped[category] = item.id;
          renderAll();
          renderGrid(category);
        };

        grid.appendChild(el);
      });
    }

    // ── Tab switching ──
    document.querySelectorAll('.slot-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.slot-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.slot-items').forEach(g => g.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`grid-${tab.dataset.tab}`).classList.add('active');
      });
    });

    // ── Modal open/close ──
    const modal = document.getElementById('moop-modal');

    document.getElementById('moop-btn').addEventListener('click', () => {
      modal.classList.add('open');
    });

    document.getElementById('done-btn').addEventListener('click', () => {
      modal.classList.remove('open');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });

    // ── Randomize ──
    document.getElementById('randomize-btn').addEventListener('click', () => {
      Object.keys(COSMETICS).forEach(cat => {
        const items = COSMETICS[cat];
        const pick = items[Math.floor(Math.random() * items.length)];
        equipped[cat] = pick.id;
      });
      renderAll();
      const activeTab = document.querySelector('.slot-tab.active');
      if (activeTab) renderGrid(activeTab.dataset.tab);
    });

    // ── Init ──
    Object.keys(COSMETICS).forEach(cat => renderGrid(cat));
    renderAll();
  </script>
</body>
</html>
