<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Bungee+Shade&family=Chicle&family=Lilita+One&family=Modak&display=swap" rel="stylesheet">
  <style>
    :root {
      --raspberry-wine: #500E2F;
      --eggplant: #820D51;
      --grape: #6528CE;
      --punch: #B21030;
      --mint: #87DCAB;
      --mustard: #D1912A;
      --pinky: #FEAED2;
      --trumskin: #CC6711;
      --shreks-toe: #A3AF0A;
      --white: #FFFDFD;
      --black: #020202;
      --cream: #F3E49D;
      --lavender: #D0BBF6;
      --sky: #71B2E6;
      --coral: #F15241;
      --peach: #FFE1B1;
      --mint-foam: #D4FFE5;
      --frost: #EAFFF3;
      --rose-mist: #FFE5EA;
      --amber: #ED9302;
      --apricot: #FFB271;
      --wisteria: #D99EFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fredoka', sans-serif;
      background: var(--raspberry-wine);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* ── Large drifting color blocks showcasing the palette ── */
    .swatch {
      position: fixed;
      z-index: 0;
      border-radius: 28px;
      will-change: transform;
    }

    /* Grape — big anchor top-left */
    .swatch-1 {
      width: 480px; height: 420px;
      background: var(--grape);
      top: -80px; left: -100px;
      border-radius: 44px;
      animation: drift1 55s ease-in-out infinite;
    }

    /* Eggplant — top right */
    .swatch-2 {
      width: 520px; height: 380px;
      background: var(--eggplant);
      top: -70px; right: -120px;
      border-radius: 40px;
      animation: drift2 65s ease-in-out infinite;
    }

    /* Trumskin — mid left */
    .swatch-3 {
      width: 340px; height: 280px;
      background: var(--trumskin);
      top: 38%; left: -60px;
      border-radius: 36px;
      animation: drift3 50s ease-in-out infinite;
    }

    /* Mint — bottom right */
    .swatch-4 {
      width: 400px; height: 340px;
      background: var(--mint);
      bottom: -90px; right: -60px;
      border-radius: 44px;
      animation: drift4 60s ease-in-out infinite;
    }

    /* Punch — bottom left */
    .swatch-5 {
      width: 360px; height: 300px;
      background: var(--punch);
      bottom: -70px; left: -80px;
      border-radius: 38px;
      animation: drift5 45s ease-in-out infinite;
    }

    /* Mustard — upper middle */
    .swatch-6 {
      width: 260px; height: 220px;
      background: var(--mustard);
      top: 5%; left: 40%;
      border-radius: 32px;
      animation: drift6 52s ease-in-out infinite;
    }

    /* Pinky — mid right */
    .swatch-7 {
      width: 280px; height: 240px;
      background: var(--pinky);
      top: 48%; right: 2%;
      border-radius: 34px;
      animation: drift7 58s ease-in-out infinite;
    }

    /* Shreks Toe — bottom middle */
    .swatch-8 {
      width: 220px; height: 200px;
      background: var(--shreks-toe);
      bottom: 8%; left: 32%;
      border-radius: 30px;
      animation: drift8 48s ease-in-out infinite;
    }

    /* Lavender — floating accent */
    .swatch-9 {
      width: 200px; height: 180px;
      background: var(--lavender);
      top: 22%; right: 18%;
      border-radius: 28px;
      animation: drift9 62s ease-in-out infinite;
    }

    /* Each block drifts on a long, lazy orbit — big travel range */
    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(180px, 120px) rotate(6deg); }
      50% { transform: translate(60px, 220px) rotate(-3deg); }
      75% { transform: translate(-120px, 80px) rotate(4deg); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-150px, 160px) rotate(-5deg); }
      50% { transform: translate(-240px, 60px) rotate(3deg); }
      75% { transform: translate(-60px, -120px) rotate(-3deg); }
    }
    @keyframes drift3 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(160px, -140px) rotate(7deg); }
      50% { transform: translate(240px, -50px) rotate(3deg); }
      75% { transform: translate(80px, 120px) rotate(-4deg); }
    }
    @keyframes drift4 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-130px, -180px) rotate(-4deg); }
      50% { transform: translate(-200px, -80px) rotate(4deg); }
      75% { transform: translate(-60px, 70px) rotate(-3deg); }
    }
    @keyframes drift5 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(170px, -100px) rotate(5deg); }
      50% { transform: translate(90px, -200px) rotate(-3deg); }
      75% { transform: translate(-70px, -120px) rotate(4deg); }
    }
    @keyframes drift6 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-100px, 150px) rotate(-6deg); }
      50% { transform: translate(80px, 200px) rotate(4deg); }
      75% { transform: translate(140px, 60px) rotate(-3deg); }
    }
    @keyframes drift7 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-140px, -130px) rotate(5deg); }
      50% { transform: translate(-60px, 110px) rotate(-4deg); }
      75% { transform: translate(110px, -70px) rotate(3deg); }
    }
    @keyframes drift8 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(100px, -150px) rotate(-5deg); }
      50% { transform: translate(-80px, -190px) rotate(6deg); }
      75% { transform: translate(-140px, 60px) rotate(-3deg); }
    }
    @keyframes drift9 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(140px, 100px) rotate(5deg); }
      50% { transform: translate(-100px, 170px) rotate(-4deg); }
      75% { transform: translate(-160px, -60px) rotate(3deg); }
    }

    /* ── Landing ── */
    .landing {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 32px 20px;
      width: 100%;
      max-width: 380px;
    }

    /* ── Logo experiments — showing option A ── */
    .logo-area {
      text-align: center;
    }

    /* Fredoka chunky with punch color + deep shadow */
    .logo {
      font-family: 'Fredoka', sans-serif;
      font-size: 5.5rem;
      font-weight: 700;
      color: var(--punch);
      line-height: 1;
      letter-spacing: 4px;
      cursor: default;
      user-select: none;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      background: rgba(42, 18, 32, 0.85);
      border: 3px solid var(--eggplant);
      border-radius: 20px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow:
        0 8px 24px rgba(0,0,0,0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* ── Inputs ── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--peach);
    }

    .field input {
      background: rgba(20, 8, 14, 0.8);
      border: 2px solid #5A2848;
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--white);
      font-family: 'Fredoka', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input::placeholder {
      color: #5A3548;
    }

    .field input:focus {
      border-color: var(--mint);
    }

    /* ── Buttons ── */
    .btn {
      border: none;
      border-radius: 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: none !important;
    }

    .btn-create {
      width: 100%;
      padding: 14px 24px;
      background: var(--mint);
      color: #1A3A28;
    }

    /* ── Divider ── */
    .divider {
      text-align: center;
      color: #6A4858;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 2px;
      background: #3A1828;
      border-radius: 1px;
    }

    /* ── Join row ── */
    .join-row {
      display: flex;
      gap: 8px;
    }

    .join-row input {
      flex: 1;
      background: rgba(20, 8, 14, 0.8);
      border: 2px solid #5A2848;
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--white);
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.15s;
    }

    .join-row input::placeholder {
      color: #5A3548;
      letter-spacing: 2px;
    }

    .join-row input:focus {
      border-color: var(--lavender);
    }

    .btn-join {
      padding: 12px 22px;
      background: var(--lavender);
      color: #2A1540;
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .footer button {
      background: none;
      border: none;
      color: #7A5068;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s;
      padding: 4px 0;
      border-bottom: 2px dotted #3A1828;
    }

    .footer button:hover {
      color: var(--pinky);
      border-bottom-color: var(--pinky);
    }

    .footer .sep {
      color: #3A1828;
      font-size: 0.7rem;
      align-self: center;
    }

    /* ── Corner details ── */
    .corner {
      position: fixed;
      z-index: 5;
      font-size: 0.65rem;
      font-weight: 500;
      pointer-events: none;
      opacity: 0.4;
    }
    .corner.bl {
      bottom: 14px; left: 16px;
      color: var(--peach);
    }
    .corner.tr {
      top: 14px; right: 16px;
      color: var(--mustard);
    }

    @media (max-width: 500px) {
      .logo { font-size: 3.8rem; }
      .card { padding: 22px 18px; }
    }
  </style>
</head>
<body>

  <!-- Big drifting palette swatches -->
  <div class="swatch swatch-1"></div>
  <div class="swatch swatch-2"></div>
  <div class="swatch swatch-3"></div>
  <div class="swatch swatch-4"></div>
  <div class="swatch swatch-5"></div>
  <div class="swatch swatch-6"></div>
  <div class="swatch swatch-7"></div>
  <div class="swatch swatch-8"></div>
  <div class="swatch swatch-9"></div>

  <div class="corner tr">v0.4</div>

  <main class="landing">
    <div class="logo-area">
      <div class="logo">MORP</div>
    </div>

    <div class="card">
      <div class="field">
        <label for="name-input">your name</label>
        <input type="text" id="name-input" placeholder="type here..." maxlength="20" autofocus>
      </div>

      <button class="btn btn-create" id="create-btn">Create Lobby</button>

      <div class="divider">or</div>

      <div class="join-row">
        <input type="text" id="code-input" placeholder="lobby code" maxlength="6">
        <button class="btn btn-join" id="join-btn">Join</button>
      </div>
    </div>

    <div class="footer">
      <button id="changelog-btn">changelog</button>
      <span class="sep">·</span>
      <button id="help-btn">how to play</button>
    </div>
  </main>

</body>
</html>
